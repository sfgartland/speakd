[project]
name = "speakd"
version = "0.0.1"
description = "Streaming speech synthesis daemon for local AI agents"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Severin Gartland" }]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
# Kokoro runs as an ONNX model (kokoro-onnx, onnxruntime on the CPU) fed by
# misaki's G2P, so there is no torch: ~0.7 GB less RAM, a far faster load.
# Optional so the core stays light.
# NOTE: misaki requires Python < 3.14.
kokoro = [
    "kokoro-onnx>=0.6.1,<0.7",
    # misaki's English dependencies, listed by hand rather than as
    # `misaki[en]`: that extra also pulls spacy-curated-transformers, which
    # requires torch and is only used by the transformer G2P (trf=True),
    # which speakd never selects.
    "misaki",
    "espeakng-loader",
    "num2words",
    "phonemizer-fork",
    "spacy",
    "sounddevice",
    "scipy",
    # Kokoro's English pronunciation (misaki) needs spaCy's small English
    # model, and downloads it at first use when missing. Declared so the
    # lockfile keeps it: otherwise every `uv sync` removes it again, and the
    # daemon's next start stalls on a download -- or fails, offline. Where it
    # comes from is in [tool.uv.sources]: it is not on PyPI, so publishing
    # this extra will mean dropping it and relying on misaki's own download.
    "en-core-web-sm",
]
# Piper is GPL-3.0 (it embeds espeak-ng), so it is an extra the user opts
# into, never a default dependency. scipy resamples Piper's audio to the
# player's rate and sounddevice plays it, mirroring the kokoro extra.
piper = [
    "piper-tts>=1.4,<2",
    "scipy",
    "sounddevice",
]
# Language detection, imported lazily on first use (speakd.detect); without
# this extra detection is off and speakd says so once, at startup.
lang = ["lingua-language-detector"]
llm = ["litellm"]

[project.scripts]
speakd = "speakd.__main__:main"
speakctl = "speakd.cli:main"
speakd-claude-hook = "speakd.clients.claude_code.hook:main"
speakd-claude-follow = "speakd.clients.claude_code.follow:main"
speakd-codex-hook = "speakd.clients.codex.hook:main"
speakd-codex-follow = "speakd.clients.codex.follow:main"
speakd-notify-follow = "speakd.clients.notifications.follow:main"
speakd-mcp = "speakd.clients.mcp.server:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
# Design docs and plans carry illustrative snippets -- ellipses, fragments
# of functions -- which ruff would otherwise try to format as real code.
extend-exclude = ["docs"]
line-length = 100
# Kept at py310: raising it surfaces UP042 (str+Enum -> StrEnum) in modules
# outside this change (model.py, protocol.py); a real improvement, but a
# separate one. requires-python is >=3.11 regardless of this setting.
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
# Pinned at 3.12: numpy's stubs use PEP 695 syntax that older targets
# cannot parse. This leaves a narrow gap — a 3.12-only construct would pass
# mypy but break at runtime for a 3.11 user — accepted knowingly because CI
# runs pytest on 3.11 and would catch an import-time syntax error there.
python_version = "3.12"
strict = true

# None of these optional dependencies ships type stubs, and none is installed in
# the default environment, so strict mode cannot resolve them. They are
# imported inside functions and immediately adapted behind our own typed
# interfaces (Player, Synthesizer), so nothing untyped escapes those modules.
[[tool.mypy.overrides]]
module = [
    "kokoro_onnx.*",
    "misaki.*",
    "sounddevice.*",
    "lingua.*",
    "piper",
    "piper.*",
    "onnxruntime",
    "onnxruntime.*",
    "scipy",
    "scipy.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# kokoro-onnx requires `phonemizer`, which installs into the same `phonemizer/`
# package directory as misaki's `phonemizer-fork`; with both present the
# files of one overwrite the other's. misaki's espeak code is written against
# the fork, so `phonemizer` is made unsatisfiable and never installed.
override-dependencies = ["phonemizer ; sys_platform == 'never'"]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
