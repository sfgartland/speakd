[project]
name = "speakd"
version = "0.0.1"
description = "Streaming speech synthesis daemon for local AI agents"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Severin Gartland" }]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
# Kokoro pulls torch; keep it out of the default install so the core stays light.
# NOTE: misaki (a kokoro dep) requires Python < 3.14.
kokoro = ["kokoro", "sounddevice", "scipy"]
llm = ["litellm"]

[project.scripts]
speakd = "speakd.__main__:main"
speakctl = "speakd.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
# Kept at py310: raising it surfaces UP042 (str+Enum -> StrEnum) in modules
# outside this change (model.py, protocol.py); a real improvement, but a
# separate one. requires-python is >=3.11 regardless of this setting.
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
# Pinned at 3.12: numpy's stubs use PEP 695 syntax that older targets
# cannot parse. This leaves a narrow gap — a 3.12-only construct would pass
# mypy but break at runtime for a 3.11 user — accepted knowingly because CI
# runs pytest on 3.11 and would catch an import-time syntax error there.
python_version = "3.12"
strict = true

# Neither optional dependency ships type stubs, and neither is installed in
# the default environment, so strict mode cannot resolve them. Both are
# imported inside functions and immediately adapted behind our own typed
# interfaces (Player, Synthesizer), so nothing untyped escapes those modules.
[[tool.mypy.overrides]]
module = ["kokoro.*", "sounddevice.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
